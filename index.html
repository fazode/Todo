<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nachtnotiz – Aufgaben diktieren</title>
<meta name="description" content="Aufgaben per Spracheingabe diktieren und als To-do-Liste speichern. Funktioniert offline, Daten bleiben auf dem Gerät.">
<meta name="theme-color" content="#0d0f13">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="src/css/style.css">
</head>
<body>
<a class="skip-link" href="#liste">Zur Liste springen</a>

<header class="topbar">
  <h1 class="brand">
    <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    Nachtnotiz
  </h1>
  <div class="topbar-actions">
    <button type="button" id="btn-dim" class="icon-btn" aria-pressed="false" title="Nachtmodus: Display abdunkeln">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
      <span class="sr-only">Nachtmodus umschalten</span>
    </button>
    <button type="button" id="btn-menu" class="icon-btn" aria-expanded="false" aria-controls="menu" title="Menü">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span class="sr-only">Menü öffnen</span>
    </button>
  </div>
</header>

<div id="menu" class="menu" hidden>
  <fieldset class="menu-group">
    <legend>Diktat</legend>
    <label class="switch"><input type="checkbox" id="opt-autosplit" checked><span>Sätze automatisch in einzelne Aufgaben trennen</span></label>
    <label class="switch"><input type="checkbox" id="opt-fillers" checked><span>Füllwörter entfernen („äh“, „ähm“ …)</span></label>
    <label class="switch"><input type="checkbox" id="opt-continuous" checked><span>Weiter zuhören, bis ich stoppe</span></label>
    <label class="switch"><input type="checkbox" id="opt-due" checked><span>Zeitangaben übernehmen („morgen um 9“, „in zwei Stunden“)</span></label>
    <label class="field"><span>Sprache</span>
      <select id="opt-lang">
        <option value="de-DE">Deutsch (DE)</option>
        <option value="de-AT">Deutsch (AT)</option>
        <option value="de-CH">Deutsch (CH)</option>
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
      </select>
    </label>
  </fieldset>
  <fieldset class="menu-group">
    <legend>Erinnerungen</legend>
    <p id="notify-state" class="hint"></p>
    <div class="menu-buttons">
      <button type="button" id="btn-notify" class="btn">Benachrichtigungen erlauben</button>
    </div>
  </fieldset>
  <fieldset class="menu-group">
    <legend>Daten</legend>
    <div class="menu-buttons">
      <button type="button" id="btn-export" class="btn">Export (JSON)</button>
      <button type="button" id="btn-import" class="btn">Import (JSON)</button>
      <button type="button" id="btn-copy" class="btn">Als Text kopieren</button>
      <button type="button" id="btn-clear-done" class="btn btn-danger">Erledigte löschen</button>
    </div>
    <input type="file" id="file-import" accept="application/json,.json" hidden>
    <p class="hint">Alles wird nur lokal im Browser gespeichert. Keine Server, kein Konto.</p>
  </fieldset>
</div>

<main>
  <section class="capture" aria-labelledby="capture-title">
    <h2 id="capture-title" class="sr-only">Aufgabe erfassen</h2>

    <p id="live" class="live" aria-live="polite" data-placeholder="Tippe auf das Mikrofon und sprich einfach drauflos."></p>

    <div class="mic-wrap">
      <button type="button" id="btn-mic" class="mic" aria-pressed="false">
        <span class="mic-ring" aria-hidden="true"></span>
        <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span class="sr-only">Diktat starten</span>
      </button>
      <p id="mic-label" class="mic-label">Tippen zum Diktieren</p>
    </div>

    <form id="form-manual" class="manual">
      <label class="sr-only" for="input-manual">Aufgabe eintippen</label>
      <input type="text" id="input-manual" placeholder="… oder eintippen" autocomplete="off" enterkeyhint="done">
      <button type="submit" class="btn btn-primary">Hinzufügen</button>
    </form>

    <p id="notice" class="notice" role="status" hidden></p>
  </section>

  <section id="liste" class="list-section" aria-labelledby="list-title">
    <div class="list-head">
      <h2 id="list-title">Aufgaben <span id="count" class="count"></span></h2>
      <div class="filters" role="group" aria-label="Filter">
        <button type="button" class="chip is-active" data-filter="open" aria-pressed="true">Offen</button>
        <button type="button" class="chip" data-filter="all" aria-pressed="false">Alle</button>
        <button type="button" class="chip" data-filter="done" aria-pressed="false">Erledigt</button>
      </div>
    </div>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>Noch nichts notiert. Sprich einfach los, der Rest kann bis morgen warten.</p>
  </section>
</main>

<dialog id="due-dialog" class="dialog">
  <form method="dialog" class="dialog-form">
    <h2 class="dialog-title">Wann soll ich erinnern?</h2>
    <p id="due-task" class="dialog-task"></p>

    <div class="quick" role="group" aria-label="Schnellauswahl">
      <button type="button" class="chip" data-quick="60">In 1 Stunde</button>
      <button type="button" class="chip" data-quick="evening">Heute 19:00</button>
      <button type="button" class="chip" data-quick="tomorrow-8">Morgen 08:00</button>
      <button type="button" class="chip" data-quick="tomorrow-18">Morgen 18:00</button>
    </div>

    <label class="field field-stacked" for="due-custom">
      <span>Eigener Zeitpunkt</span>
      <input type="datetime-local" id="due-custom">
    </label>

    <div class="dialog-actions">
      <button type="submit" class="btn" value="cancel">Abbrechen</button>
      <button type="submit" class="btn btn-danger" value="clear" id="due-clear">Erinnerung entfernen</button>
      <button type="submit" class="btn btn-primary" value="save">Speichern</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden>
  <span id="toast-text"></span>
  <button type="button" id="toast-action" class="toast-btn">Rückgängig</button>
</div>

<script type="module" src="src/js/app.js"></script>
</body>
</html>
